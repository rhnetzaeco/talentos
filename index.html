<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco de Talentos · Netza&amp;CO</title>
<meta name="description" content="Cadastre-se no Banco de Talentos do ecossistema Netza&amp;CO.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,700;0,900;1,700;1,900&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark__mode');</script>
<style>
:root { --verde-main:#7FFB89; --verde-8:#04780E; --roxo:#7E3AE9; --rosa:#E732A9; --branco:#FFF; --preto-1:#F4F6F4; --preto-2:#E4E6E4; --preto-4:#B6B7B6; --preto-6:#6E6E6E; --preto-7:#363736; --preto-8:#1C1B1C; --preto-bg-site:#131313; --secundaria-2:#F5F5FC; --font-primary:'Open Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; color-scheme: light; }
html.dark__mode { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: #F5F5FC; }
html.dark__mode body { background: #131313; }
.nb-topo { background: #040404; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.nb-topo img { height: 34px; width: auto; display: block; }
.nb-tema { border: 1px solid #363736; background: none; color: #F4F6F4; border-radius: 999px; padding: 6px 12px; font: 600 13px 'Open Sans', sans-serif; cursor: pointer; }
/* Netza&CO · Carreiras — segue os tokens do tema netzaeco (claro por padrão; html.dark__mode = escuro) */
.nc {
  --nc-bg: var(--secundaria-2, #F5F5FC);
  --nc-card: var(--branco, #FFFFFF);
  --nc-card-2: var(--preto-1, #F4F6F4);
  --nc-tinta: var(--preto-8, #1C1B1C);
  --nc-mute: var(--preto-6, #6E6E6E);
  --nc-linha: var(--preto-2, #E4E6E4);
  --nc-verde: var(--verde-main, #7FFB89);
  --nc-verde-esc: var(--verde-8, #04780E);
  --nc-roxo: var(--roxo, #7E3AE9);
  --nc-rosa: var(--rosa, #E732A9);
  --nc-btn: var(--preto-8, #1C1B1C);
  --nc-btn-txt: var(--verde-main, #7FFB89);
  --nc-serif: Merriweather, Georgia, "Times New Roman", serif;
  --nc-sans: var(--font-primary, "Open Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif);
  background: var(--nc-bg); color: var(--nc-tinta); font-family: var(--nc-sans); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
html.dark__mode .nc {
  --nc-bg: var(--preto-bg-site, #131313);
  --nc-card: var(--preto-8, #1C1B1C);
  --nc-card-2: #232323;
  --nc-tinta: var(--preto-1, #F4F6F4);
  --nc-mute: var(--preto-4, #B6B7B6);
  --nc-linha: var(--preto-7, #363736);
  --nc-verde-esc: var(--verde-main, #7FFB89);
  --nc-btn: var(--preto-7, #363736);
}
.nc *, .nc *::before, .nc *::after { box-sizing: border-box; }
.nc-in { max-width: var(--container-maior, 1180px); margin: 0 auto; padding: 0 16px; }
.nc a { color: inherit; }
.nc h1, .nc h2, .nc h3 { font-family: var(--nc-serif); margin: 0; letter-spacing: -.005em; color: var(--nc-tinta); }
.nc-grad { font-style: italic; background: linear-gradient(90deg, #B4EEC9, #83FF8E, #9BB6FF, #B79AFF); -webkit-background-clip: text; background-clip: text; color: transparent; }
html:not(.dark__mode) .nc-grad { background: linear-gradient(90deg, #12A61F, #4DE35A, #1436F4, #7E3AE9); -webkit-background-clip: text; background-clip: text; }

/* hero */
.nc-hero { padding: 72px 0 56px; text-align: center; }
.nc-hero small { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--nc-mute); margin-bottom: 14px; }
.nc-hero h1 { font-size: clamp(30px, 5vw, 52px); line-height: 1.12; font-weight: 700; }
.nc-hero h1 em { display: block; font-weight: 900; }
.nc-hero p { max-width: 640px; margin: 18px auto 0; color: var(--nc-mute); font-size: 17px; }
.nc-hero .nc-btn { margin-top: 26px; }

/* botões */
.nc-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid transparent; border-radius: 6px; padding: 12px 22px; font: 600 15px var(--nc-sans); letter-spacing: .02em; cursor: pointer; text-decoration: none; background: var(--nc-btn); color: var(--nc-btn-txt); transition: transform .15s, box-shadow .15s; }
.nc-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.nc-btn.claro { background: #fff; color: #1C1B1C; border-color: var(--nc-linha); }
.nc-btn.verde { background: var(--nc-verde); color: #0A0B0A; }
.nc-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.nc-btn:focus-visible, .nc input:focus-visible, .nc select:focus-visible, .nc textarea:focus-visible, .nc-vaga:focus-visible { outline: 2px solid var(--nc-verde); outline-offset: 2px; }

/* sobre */
.nc-sec { padding: 40px 0; }
.nc-sec h2 { font-size: clamp(22px, 3vw, 30px); font-weight: 900; margin-bottom: 14px; }
.nc-sobre { display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: start; }
.nc-sobre p { margin: 0 0 12px; color: var(--nc-mute); }
.nc-pilares { display: grid; gap: 10px; }
.nc-pilar { background: var(--nc-card); border: 1px solid var(--nc-linha); border-radius: 12px; padding: 16px 18px; }
.nc-pilar b { display: block; font-family: var(--nc-serif); font-size: 16px; margin-bottom: 2px; }
.nc-pilar span { color: var(--nc-mute); font-size: 14.5px; }

/* filtros + lista */
.nc-filtros { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; margin: 8px 0 20px; }
.nc-campo { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--nc-mute); }
.nc input[type=text], .nc input[type=email], .nc input[type=tel], .nc input[type=url], .nc select, .nc textarea {
  width: 100%; padding: 12px 14px; border: 1px solid var(--nc-linha); border-radius: 8px; background: var(--nc-card); color: var(--nc-tinta); font: 400 15px var(--nc-sans); }
.nc textarea { min-height: 140px; resize: vertical; line-height: 1.55; }
.nc-lista { display: grid; gap: 12px; }
.nc-vaga { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; background: var(--nc-card); border: 1px solid var(--nc-linha); border-radius: 12px; padding: 20px 22px; text-decoration: none; transition: border-color .15s, transform .15s; }
.nc-vaga:hover { border-color: var(--nc-verde); transform: translateY(-1px); }
.nc-vaga h3 { font-size: 19px; font-weight: 700; }
.nc-vaga .nc-seta { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--nc-btn); color: var(--nc-btn-txt); font-size: 18px; }
.nc-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.nc-tag { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--nc-card-2); color: var(--nc-mute); border: 1px solid var(--nc-linha); }
.nc-tag.fixa { background: var(--nc-verde); color: #0A0B0A; border-color: transparent; }
.nc-vazio { padding: 28px; text-align: center; color: var(--nc-mute); background: var(--nc-card); border: 1px dashed var(--nc-linha); border-radius: 12px; }

/* detalhe */
.nc-voltar { display: inline-flex; gap: 8px; align-items: center; margin: 28px 0 0; font-size: 14px; font-weight: 600; color: var(--nc-mute); text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; }
.nc-det-cab { padding: 22px 0 28px; border-bottom: 1px solid var(--nc-linha); display: flex; gap: 20px; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
.nc-det-cab h1 { font-size: clamp(28px, 4.2vw, 44px); font-weight: 900; line-height: 1.15; }
.nc-det-cab .nc-acoes { display: flex; gap: 10px; flex-wrap: wrap; }
.nc-det { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 36px; padding: 32px 0 64px; align-items: start; }
.nc-texto h2 { font-size: 20px; font-weight: 900; margin: 26px 0 10px; }
.nc-texto h2:first-child { margin-top: 0; }
.nc-texto p { margin: 0 0 12px; }
.nc-texto ul { margin: 0 0 12px; padding: 0; list-style: none; }
.nc-texto li { position: relative; padding-left: 20px; margin-bottom: 8px; }
.nc-texto li::before { content: ""; position: absolute; left: 0; top: .62em; width: 8px; height: 8px; border-radius: 2px; background: var(--nc-verde); }
.nc-resumo { position: sticky; top: 110px; background: var(--nc-card); border: 1px solid var(--nc-linha); border-radius: 12px; padding: 20px; }
.nc-resumo dl { margin: 0 0 16px; display: grid; gap: 10px; }
.nc-resumo dt { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--nc-mute); }
.nc-resumo dd { margin: 0; font-weight: 600; }
.nc-resumo .nc-btn { width: 100%; }

/* formulário */
.nc-form-sec { background: var(--nc-card); border: 1px solid var(--nc-linha); border-radius: 16px; padding: 28px; margin: 0 0 64px; scroll-margin-top: 110px; }
.nc-form-sec > h2 { font-size: 26px; font-weight: 900; }
.nc-form-sec > p { color: var(--nc-mute); margin: 6px 0 20px; }
.nc-form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
.nc-form .cheio { grid-column: 1 / -1; }
.nc-form label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; color: var(--nc-tinta); }
.nc-form label small, .nc-ajuda { font-weight: 400; color: var(--nc-mute); font-size: 13px; }
.nc-tel { display: grid; grid-template-columns: 110px 1fr; gap: 8px; }
.nc-arq { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border: 1.5px dashed var(--nc-linha); border-radius: 10px; padding: 14px; }
.nc-arq input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.nc-arq .nc-arq-nome { color: var(--nc-mute); font-size: 14px; font-weight: 400; word-break: break-all; }
.nc-arq.ok { border-color: var(--nc-verde-esc); }
.nc-erro { color: var(--nc-rosa); font-size: 13px; font-weight: 600; }
.nc-campo-erro input, .nc-campo-erro select, .nc-campo-erro textarea, .nc-campo-erro .nc-arq { border-color: var(--nc-rosa) !important; }
.nc-diver { grid-column: 1 / -1; border: 1px solid var(--nc-linha); border-radius: 12px; padding: 18px; margin: 4px 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; background: var(--nc-card-2); }
.nc-diver legend { font-family: var(--nc-serif); font-weight: 900; font-size: 17px; padding: 0 6px; }
.nc-diver > p { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--nc-mute); }
.nc-check { display: flex !important; grid-template-columns: none; gap: 10px !important; align-items: flex-start; font-weight: 400 !important; font-size: 14px !important; }
.nc-check input { width: 18px; height: 18px; margin-top: 2px; flex: none; accent-color: var(--nc-roxo); }
.nc-pote { position: absolute !important; left: -9999px !important; width: 1px; height: 1px; overflow: hidden; }
.nc-enviar { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.nc-aviso { grid-column: 1 / -1; padding: 12px 14px; border-radius: 10px; background: var(--nc-card-2); font-size: 14px; }
.nc-aviso.erro { background: rgba(231, 50, 169, .1); color: var(--nc-rosa); font-weight: 600; }
.nc-ok { text-align: center; padding: 48px 20px 64px; }
.nc-ok .nc-selo { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 16px; background: var(--nc-verde); color: #0A0B0A; font-size: 30px; font-weight: 800; }
.nc-ok h2 { font-size: 30px; font-weight: 900; }
.nc-ok p { color: var(--nc-mute); max-width: 520px; margin: 10px auto 22px; }

@media (max-width: 900px) {
  .nc-sobre, .nc-det { grid-template-columns: 1fr; }
  .nc-resumo { position: static; }
  .nc-filtros { grid-template-columns: 1fr 1fr; }
  .nc-filtros .nc-campo:first-child { grid-column: 1 / -1; }
}
@media (max-width: 600px) {
  .nc-hero { padding: 48px 0 36px; }
  .nc-form, .nc-diver { grid-template-columns: 1fr; }
  .nc-form-sec { padding: 20px 16px; border-radius: 12px; }
  .nc-vaga { padding: 16px; }
  .nc-filtros { grid-template-columns: 1fr; }
  .nc-enviar .nc-btn { width: 100%; }
}

.nb-passos { margin: 0 0 4px; padding-left: 22px; display: grid; gap: 6px; }
.nb-codigo { width: 100%; min-height: 110px; margin-top: 8px; font: 12px ui-monospace, Consolas, monospace; word-break: break-all; padding: 10px; border: 1px solid var(--nc-linha); border-radius: 8px; background: var(--nc-card-2); color: var(--nc-tinta); }
.nb-priv { border: 1px solid var(--nc-linha); border-radius: 10px; padding: 10px 14px; font-size: 14px; background: var(--nc-card-2); } .nb-priv summary { cursor: pointer; font-weight: 600; } .nb-priv ul { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 6px; color: var(--nc-mute); } .nb-priv b { color: var(--nc-tinta); }
.nb-rodape { text-align: center; color: #6E6E6E; font: 13px 'Open Sans', sans-serif; padding: 0 16px 40px; }
</style>
</head>

<script>window.NB_CONFIG = { email: 'trabalheconosco@netza.com.br', privacidade: 'https://netzaeco.com.br/politica-de-privacidade/', kid: '35E9492D', chave: {"key_ops":["encrypt"],"ext":true,"alg":"RSA-OAEP-256","kty":"RSA","n":"pjrikMojYRFW-RE3WqOp4QY0yeLibguD5amzi0na1mzgodNkMopO1cLqiA_ikEV_3yuwbHFg2hnda_rmnIC2BHHKXkJvQt4-WnhCuqx-8MMBs3CmPvfxplqaJ_hmNKL504z-OvMyDqNtjbxBRB82Hpu8bNSYE8HD25ub6DRl0qh4buaI5w9pATZn7j031GpLBKHgs_nBwohd0BWANgDxlYUYO6rFxfWQnVobKD28RipIs6nLXE8vT1xh5WHfC9uC_fozKHbz0Grtjpf-1dR0FcW4EHpHKd2_38msb0Aiid8TMdwB-6zOPVH-EVczmgTHK5mJcaElmq74Is-FRtDD60eIiSIwvcKtNoWdY4VgJxYoy2Fbfu6Y9XpMZTEdhHhZwHh7jsnMXDAxdEx04iJoWWivqOnsiUbCfad2eCl03oxt8NwvBc2gHf0BvliTLBr15X7JSoT0W4yAL0VjxBU2fxmxnU7WqyG3KNCSV6dzygCLQeTywI_lRorFROPQ-Kfn","e":"AQAB"} };
document.getElementById('nb-tema').onclick = () => document.documentElement.classList.toggle('dark__mode');</script>
<script>
/* Netza&CO · Cadastro no Banco de Talentos — página estática (GitHub Pages).
   Sem servidor: os dados viram um código (NB1:…:FIM) que a pessoa envia por e-mail ao RH, com o currículo anexo.
   O Netza&CO Recruiter lê o código e cria o card no Banco de talentos. */
(function () {
  const raiz = document.getElementById('nc-app');
  const C = Object.assign({ email: 'trabalheconosco@netza.com.br', privacidade: 'https://netzaeco.com.br/politica-de-privacidade/' }, window.NB_CONFIG || {});
  const LIBS = { pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', pdfw: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js', zip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js' };
  const AREAS = ['Administrativo', 'Atendimento / Contas', 'Comercial / Novos negócios', 'Conteúdo e Branded Content', 'Criação / Design', 'Dados e BI', 'Eventos e Live Marketing', 'Facilities', 'Financeiro', 'Influência', 'Jurídico', 'Marketing Digital / Mídia', 'Planejamento', 'Produção', 'Produção audiovisual', 'Promo e Incentivo', 'Recursos Humanos', 'Tecnologia (TI)', 'Outra'];
  const REGIMES = ['CLT', 'PJ', 'Estágio', 'Tanto faz'];
  const MODELOS = ['Presencial', 'Híbrido', 'Home Office', 'Tanto faz'];
  const RACA = ['Amarela', 'Branca', 'Indígena', 'Parda', 'Preta', 'Prefiro não informar'];
  const GENERO = ['Mulher cisgênero', 'Homem cisgênero', 'Mulher trans / travesti', 'Homem trans', 'Pessoa não binária', 'Outra identidade', 'Prefiro não informar'];
  const PCD = ['Sim', 'Não', 'Prefiro não informar'];
  const ORIENT = ['Assexual', 'Bissexual', 'Gay', 'Heterossexual', 'Lésbica', 'Pansexual', 'Outra orientação', 'Prefiro não informar'];
  const MAX_CV = 3500; // caracteres do texto do currículo que vão no código (o arquivo completo vai anexo)

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const $ = (s) => raiz.querySelector(s);
  const opcoes = (L, sel) => L.map((x) => `<option ${x === sel ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const moeda = (txt) => { const d = String(txt || '').replace(/\D/g, ''); return d ? (Number(d) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : ''; };
  const carregados = {};
  const carregar = (k) => (carregados[k] ??= new Promise((ok, falha) => { const s = document.createElement('script'); s.src = LIBS[k]; s.onload = ok; s.onerror = () => falha(new Error('lib')); document.head.append(s); }));
  const F = { ddi: '+55', erros: {}, arquivo: null, cv_texto: '', lendo: false };
  let pronto = null;

  /* ── código: JSON → deflate → base64url, com soma de verificação ── */
  const b64u = (bytes) => { let s = ''; bytes.forEach((b) => (s += String.fromCharCode(b))); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const soma = (s) => { let h = 7; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; return h.toString(36).toUpperCase().padStart(4, '0'); };
  // NB2: JSON compactado e criptografado (AES-GCM 256) com uma chave de uso único, que vai cifrada com a chave pública do RH (RSA-OAEP 3072).
  // Só o Recruiter tem a chave privada: o código copiado, encaminhado ou vazado não revela nada.
  async function codificar(obj) {
    const sub = window.crypto && window.crypto.subtle;
    if (!sub || !C.chave) throw new Error('sem_cripto');
    let bruto = new TextEncoder().encode(JSON.stringify(obj));
    if (window.CompressionStream) bruto = new Uint8Array(await new Response(new Blob([bruto]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
    const pub = await sub.importKey('jwk', C.chave, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
    const aes = await sub.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await sub.encrypt({ name: 'AES-GCM', iv }, aes, bruto));
    const ek = new Uint8Array(await sub.encrypt({ name: 'RSA-OAEP' }, pub, await sub.exportKey('raw', aes)));
    const corpo = [C.kid, window.CompressionStream ? 'z' : 'j', b64u(ek), b64u(iv), b64u(ct)].join('.');
    return `NB2:${corpo}:${soma(corpo)}:FIM`;
  }

  /* ── tela ── */
  function desenhar() {
    if (pronto) return enviar();
    const er = (k) => (F.erros[k] ? `<span class="nc-erro">${esc(F.erros[k])}</span>` : ''), cls = (k) => (F.erros[k] ? 'nc-campo-erro' : ''), val = (k) => esc(F[k] || '');
    raiz.innerHTML = `<section class="nc-hero"><div class="nc-in"><small>Carreiras · Netza&amp;CO</small>
      <h1>Banco de Talentos<em class="nc-grad">Vem ser Netza&amp;CO.</em></h1>
      <p>Não encontrou uma vaga com o seu perfil agora? Deixe seus dados e currículo. Usamos o banco para todas as empresas do ecossistema Netza&amp;CO, em publicidade e live marketing, promo e incentivo, influência, audiovisual, conteúdo, dados e áreas administrativas (financeiro, facilities, TI e mais).</p></div></section>
    <div class="nc-in"><section class="nc-form-sec" id="nc-form"><h2>Cadastre-se</h2><p>Campos com * são obrigatórios. Leva cerca de 5 minutos. No final, você envia o cadastro para o nosso e-mail de Recrutamento, com o currículo anexo.</p>
    <form class="nc-form" id="nc-f" novalidate>
      <label class="${cls('nome')}">Nome completo *<input type="text" name="nome" autocomplete="name" value="${val('nome')}">${er('nome')}</label>
      <label class="${cls('email')}">Seu melhor e-mail *<input type="email" name="email" autocomplete="email" value="${val('email')}">${er('email')}</label>
      <label class="${cls('celular')}">Celular com DDD *<span class="nc-tel"><select name="ddi" aria-label="País"><option value="+55" ${F.ddi === '+55' ? 'selected' : ''}>Brasil +55</option><option value="+351" ${F.ddi === '+351' ? 'selected' : ''}>Portugal +351</option><option value="+1" ${F.ddi === '+1' ? 'selected' : ''}>EUA/Canadá +1</option></select><input type="tel" name="celular" autocomplete="tel-national" placeholder="(11) 91234-5678" value="${val('celular')}"></span>${er('celular')}</label>
      <label class="${cls('linkedin')}">LinkedIn *<input type="url" name="linkedin" placeholder="https://www.linkedin.com/in/seu-perfil" value="${val('linkedin')}">${er('linkedin')}</label>
      <label class="${cls('area')}">Área de atuação *<select name="area"><option value="">Escolha uma opção</option>${opcoes(AREAS, F.area)}</select>${er('area')}</label>
      <label class="${cls('cargo')}">Cargo pretendido *<input type="text" name="cargo" placeholder="Ex.: Produtor(a) de eventos Pleno" value="${val('cargo')}">${er('cargo')}</label>
      <label>Regime de preferência<select name="regime">${opcoes(REGIMES, F.regime || 'Tanto faz')}</select></label>
      <label>Modelo de trabalho<select name="modelo">${opcoes(MODELOS, F.modelo || 'Tanto faz')}</select></label>
      <label class="${cls('local')}">Cidade / UF *<input type="text" name="local" placeholder="São Paulo, SP" value="${val('local')}">${er('local')}</label>
      <label class="${cls('pretensao')}">Pretensão salarial (mensal) *<input type="text" name="pretensao" inputmode="numeric" placeholder="R$ 0,00" value="${val('pretensao')}">${er('pretensao')}</label>
      <div class="cheio ${cls('cv')}"><span style="font-size:14px;font-weight:600">Currículo *</span> <small class="nc-ajuda">PDF ou Word (DOCX). Os dados entram no seu cadastro, e você também vai anexar o arquivo no e-mail.</small>
        <label class="nc-arq ${F.arquivo ? 'ok' : ''}" style="margin-top:6px"><input type="file" id="nc-cv" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><span class="nc-btn claro" aria-hidden="true">Escolher currículo</span><span class="nc-arq-nome" id="nc-cv-nome">${F.arquivo ? esc(F.arquivo.name) + (F.lendo ? ' · lendo…' : ' ✓') : 'Nenhum arquivo escolhido'}</span></label>${er('cv')}</div>
      <label class="cheio ${cls('resumo')}">Resumo da sua experiência *<small>Conte em poucas linhas a sua trajetória, principais atividades e resultados (até 1.000 caracteres).</small><textarea name="resumo" maxlength="1000">${val('resumo')}</textarea>${er('resumo')}</label>
      <fieldset class="nc-diver"><legend>Autodeclaração (opcional)</legend>
        <p>Estas respostas são <b>opcionais</b>. Você pode deixar em branco ou escolher “Prefiro não informar”. Elas servem para duas coisas, e você escolhe abaixo o que autoriza: acompanhar a diversidade dos nossos processos (só em números agregados) e, se quiser, concorrer às <b>vagas afirmativas</b> da Netza&amp;CO.</p>
        <label>Raça/cor<select name="raca"><option value="">—</option>${opcoes(RACA, F.raca)}</select></label>
        <label>Identidade de gênero<select name="genero"><option value="">—</option>${opcoes(GENERO, F.genero)}</select></label>
        <label>Orientação sexual<select name="orientacao"><option value="">—</option>${opcoes(ORIENT, F.orientacao)}</select></label>
        <label>Pessoa com deficiência (PcD)<select name="pcd"><option value="">—</option>${opcoes(PCD, F.pcd)}</select></label>
        <label class="nc-check cheio ${cls('cons_diver')}" style="grid-column:1/-1"><input type="checkbox" name="cons_diver" ${F.cons_diver ? 'checked' : ''}><span>Autorizo a Netza&amp;CO a tratar estas informações, de forma agregada e sem vínculo com o meu cadastro, para acompanhar a diversidade dos processos seletivos (LGPD, art. 11). <small>(necessário só se você responder acima)</small>${er('cons_diver')}</span></label>
        <label class="nc-check cheio" style="grid-column:1/-1"><input type="checkbox" name="cons_afirm" ${F.cons_afirm ? 'checked' : ''}><span><b>Quero concorrer a vagas afirmativas.</b> Autorizo que minha autodeclaração fique no meu cadastro e seja vista pela equipe de Recrutamento e Seleção da Netza&amp;CO, só para me considerar em vagas afirmativas (LGPD, art. 11, I). Posso retirar essa autorização quando quiser. <small>(opcional)</small></span></label>
      </fieldset>
      <label class="nc-check cheio ${cls('cons')}"><input type="checkbox" name="cons" ${F.cons ? 'checked' : ''}><span>Li e concordo com a <a href="${esc(C.privacidade)}" target="_blank" rel="noopener">Política de Privacidade</a> e autorizo a Netza&amp;CO a guardar meus dados no Banco de Talentos para processos seletivos, por até 24 meses. *${er('cons')}</span></label>
      <details class="nb-priv cheio"><summary>Como cuidamos dos seus dados (LGPD)</summary>
        <ul>
          <li><b>Quem trata:</b> Netza&amp;CO, para recrutamento e seleção nas empresas do ecossistema.</li>
          <li><b>Para quê:</b> avaliar o seu perfil e entrar em contato sobre oportunidades. Não vendemos nem cedemos seus dados.</li>
          <li><b>Base legal:</b> o seu consentimento (LGPD, art. 7º, I). A autodeclaração é opcional e tem consentimento próprio (art. 11, I).</li>
          <li><b>Segurança:</b> esta página não guarda nada. O currículo é lido no seu próprio aparelho, e o cadastro sai criptografado: só a equipe de Recrutamento da Netza&amp;CO consegue abrir.</li>
          <li><b>Quem acessa:</b> só a equipe de Recrutamento e Seleção. A autodeclaração entra em números agregados e só fica no seu cadastro se você escolher concorrer a vagas afirmativas.</li>
          <li><b>Por quanto tempo:</b> até 24 meses, ou até você pedir a exclusão.</li>
          <li><b>Seus direitos:</b> confirmar, acessar, corrigir, excluir os seus dados ou retirar o consentimento a qualquer momento (art. 18). Basta escrever para <a href="mailto:${esc(C.email)}?subject=${encodeURIComponent('LGPD · Banco de Talentos')}">${esc(C.email)}</a>.</li>
        </ul></details>
      ${F.erroGeral ? `<div class="nc-aviso erro" role="alert">${esc(F.erroGeral)}</div>` : ''}
      <div class="nc-enviar"><button class="nc-btn" type="submit">Continuar</button><span class="nc-ajuda">No próximo passo, você envia o cadastro por e-mail.</span></div>
    </form></section></div>`;
    ligar();
  }
  function ler() { const f = $('#nc-f'); if (!f) return; new FormData(f).forEach((x, k) => (F[k] = x)); F.cons = f.cons.checked; F.cons_diver = f.cons_diver.checked; F.cons_afirm = f.cons_afirm.checked; }
  function ligar() {
    const f = $('#nc-f');
    f.pretensao.onblur = () => (f.pretensao.value = moeda(f.pretensao.value));
    $('#nc-cv').onchange = async (e) => {
      const arq = e.target.files[0]; ler(); F.erros.cv = ''; if (!arq) return;
      if (!/\.(pdf|docx)$/i.test(arq.name)) { F.erros.cv = 'Escolha o currículo em PDF ou Word (DOCX).'; return refazer(); }
      if (arq.size > 8 * 1024 * 1024) { F.erros.cv = 'O arquivo passa de 8 MB.'; return refazer(); }
      F.arquivo = arq; F.lendo = true; refazer();
      try { F.cv_texto = await textoDoCurriculo(arq); } catch (err) { F.cv_texto = ''; }
      F.lendo = false; refazer();
    };
    f.onsubmit = async (e) => { e.preventDefault(); ler(); if (!validar()) { refazer(); raiz.querySelector('.nc-campo-erro')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; } await gerar(); };
  }
  function refazer() { const y = scrollY; desenhar(); scrollTo(0, y); }
  function validar() {
    const E = {};
    if (String(F.nome || '').trim().split(/\s+/).length < 2) E.nome = 'Informe nome e sobrenome.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(F.email || '').trim())) E.email = 'Informe um e-mail válido.';
    if (String(F.celular || '').replace(/\D/g, '').length < 8) E.celular = 'Informe o celular com DDD.';
    if (!/linkedin\.com\//i.test(F.linkedin || '')) E.linkedin = 'Cole o link do seu perfil no LinkedIn.';
    if (!F.area) E.area = 'Escolha a sua área de atuação.';
    if (!String(F.cargo || '').trim()) E.cargo = 'Informe o cargo pretendido.';
    if (String(F.local || '').trim().length < 3) E.local = 'Informe cidade e estado.';
    if (!moeda(F.pretensao)) E.pretensao = 'Informe a sua pretensão.';
    if (!F.arquivo) E.cv = 'Escolha o seu currículo.';
    if (String(F.resumo || '').trim().length < 40) E.resumo = 'Escreva um resumo com pelo menos algumas linhas.';
    if ((F.raca || F.genero || F.orientacao || F.pcd) && !F.cons_diver && !F.cons_afirm) E.cons_diver = 'Marque a autorização ou deixe a autodeclaração em branco.';
    if (!F.cons) E.cons = 'É preciso concordar para continuar.';
    F.erros = E; F.erroGeral = Object.keys(E).length ? 'Confira os campos destacados.' : '';
    return !Object.keys(E).length;
  }
  async function gerar() {
    if (F.lendo) await new Promise((r) => { const t = setInterval(() => { if (!F.lendo) { clearInterval(t); r(); } }, 200); });
    const d = { v: 1, em: new Date().toISOString(), nome: F.nome.trim(), email: F.email.trim(), celular: `${F.ddi} ${F.celular.trim()}`, linkedin: F.linkedin.trim(), area: F.area, cargo: F.cargo.trim(),
      regime: F.regime, modelo: F.modelo, local: F.local.trim(), pretensao: moeda(F.pretensao), resumo: F.resumo.trim(), cv_nome: F.arquivo.name, cv_texto: String(F.cv_texto || '').replace(/[ \t]+/g, ' ').slice(0, MAX_CV), cons: 1 };
    const auto = { raca: F.raca || '', genero: F.genero || '', orientacao: F.orientacao || '', pcd: F.pcd || '' };
    if (F.cons_diver && (auto.raca || auto.genero || auto.orientacao || auto.pcd)) d.censo = auto;
    if (F.cons_afirm && (auto.raca || auto.genero || auto.orientacao || auto.pcd)) d.afirmativa = { ...auto, consentimento: new Date().toISOString() };
    try { pronto = { d, codigo: await codificar(d) }; }
    catch (e) { F.erroGeral = 'Seu navegador não conseguiu proteger os dados do cadastro. Atualize o navegador (Chrome, Safari ou Edge) e tente de novo.'; return refazer(); }
    F.cv_texto = ''; // o texto do currículo só fica no código criptografado
    desenhar(); scrollTo(0, 0);
  }
  function enviar() {
    const { d, codigo } = pronto, pn = d.nome.split(' ')[0];
    const assunto = `Cadastro Banco de Talentos · ${d.nome}`;
    const corpo = `Olá! Segue o meu cadastro para o Banco de Talentos da Netza&CO. O meu currículo está anexo.\n\nNome: ${d.nome}\n\nCódigo do cadastro (criptografado, não altere):\n${codigo}\n`;
    const mailto = `mailto:${C.email}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
    raiz.innerHTML = `<div class="nc-in"><section class="nc-form-sec" style="margin-top:32px"><h2>Falta só enviar, ${esc(pn)}!</h2>
      <p>O seu cadastro está pronto. Para concluir:</p>
      <ol class="nb-passos"><li>Toque em <b>Enviar por e-mail</b>. O e-mail já vem preenchido com o seu cadastro.</li><li><b>Anexe o seu currículo</b> (${esc(d.cv_nome)}).</li><li>Envie. Pronto!</li></ol>
      <div class="nc-enviar" style="margin:16px 0 8px"><a class="nc-btn" href="${mailto}">Enviar por e-mail</a><button class="nc-btn claro" id="nb-copiar">Copiar o cadastro</button></div>
      <p class="nc-ajuda">Se o botão não abrir o seu e-mail, copie o cadastro e envie para <b>${esc(C.email)}</b> com o assunto “${esc(assunto)}” e o currículo anexo.</p>
      <details style="margin-top:12px"><summary class="nc-ajuda" style="cursor:pointer">Ver o código do cadastro</summary><textarea class="nb-codigo" readonly id="nb-cod">${esc(codigo)}</textarea></details>
      <div class="nc-enviar" style="margin-top:18px"><button class="nc-btn claro" id="nb-voltar">Voltar e corrigir</button></div></section></div>`;
    $('#nb-copiar').onclick = async () => { const t = `Assunto: ${assunto}\n\n${corpo}`; try { await navigator.clipboard.writeText(t); $('#nb-copiar').textContent = 'Copiado!'; } catch (e) { raiz.querySelector('details').open = true; const a = $('#nb-cod'); a.focus(); a.select(); } };
    $('#nb-voltar').onclick = () => { pronto = null; desenhar(); };
  }
  async function textoDoCurriculo(arq) {
    const buf = await arq.arrayBuffer();
    if (/\.pdf$/i.test(arq.name)) {
      await carregar('pdf'); const pdfjs = window.pdfjsLib; pdfjs.GlobalWorkerOptions.workerSrc = LIBS.pdfw;
      const doc = await pdfjs.getDocument({ data: buf }).promise; let t = '';
      for (let i = 1; i <= Math.min(doc.numPages, 5); i++) { const c = await (await doc.getPage(i)).getTextContent(); t += c.items.map((x) => x.str + (x.hasEOL ? '\n' : ' ')).join('') + '\n'; }
      return t.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    }
    await carregar('zip'); const z = await window.JSZip.loadAsync(buf), xml = await z.file('word/document.xml')?.async('string');
    return xml ? xml.replace(/<w:p[ >]/g, '\n$&').replace(/<w:tab\/>/g, ' ').replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/\n{3,}/g, '\n\n').trim() : '';
  }
  desenhar();
})();

</script>
